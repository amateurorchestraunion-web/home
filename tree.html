<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>크리스마스트리 꾸미기</title>
  <link rel="stylesheet" href="tree.css" />
</head>

<body class="panel-open">

  <!-- 🌲 트리 영역 -->
  <div class="tree-container">
    <img id="tree" src="assets/img/tree.png" alt="tree">
  </div>

  <!-- 🎁 오너먼트 패널 (PC용 30%) -->
  <div id="ornamentPanel" class="ornament-panel">
    <div class="panel-header">
      <span>오너먼트 선택</span>
      <button id="closePanel" class="close-btn">✕</button>
    </div>

    <div class="ornament-grid">
      <!-- 오너먼트 이미지들 -->
      <img src="assets/img/ornaments/ornament-01.png" class="orn" data-id="01">
      <img src="assets/img/ornaments/ornament-02.png" class="orn" data-id="02">
      <img src="assets/img/ornaments/ornament-03.png" class="orn" data-id="03">
      <img src="assets/img/ornaments/ornament-04.png" class="orn" data-id="04">
      <img src="assets/img/ornaments/ornament-05.png" class="orn" data-id="05">
      <img src="assets/img/ornaments/ornament-06.png" class="orn" data-id="06">
      <img src="assets/img/ornaments/ornament-07.png" class="orn" data-id="07">
      <img src="assets/img/ornaments/ornament-08.png" class="orn" data-id="08">
      <img src="assets/img/ornaments/ornament-09.png" class="orn" data-id="09">
      <img src="assets/img/ornaments/ornament-10.png" class="orn" data-id="10">
      <img src="assets/img/ornaments/ornament-11.png" class="orn" data-id="11">
      <img src="assets/img/ornaments/ornament-12.png" class="orn" data-id="12">
    </div>
  </div>

  <!-- ⭐ 패널이 닫혔을 때 나타나는 플로팅 아이콘 -->
  <div id="floatingOrnamentBtn" class="floating-btn hidden">
    <img src="assets/img/bulb.png" alt="오너먼트">
  </div>

  <!-- 📱 모바일 슬라이드 패널 -->
  <div id="mobilePanel" class="mobile-panel">
    <div class="mobile-header">
      <span>오너먼트 선택</span>
      <button id="closeMobilePanel" class="close-btn">✕</button>
    </div>

    <div class="mobile-grid">
      <!-- 모바일용 오너먼트 동일하게 -->
      <img src="assets/img/ornaments/ornament-01.png" class="orn" data-id="01">
      <img src="assets/img/ornaments/ornament-02.png" class="orn" data-id="02">
      <img src="assets/img/ornaments/ornament-03.png" class="orn" data-id="03">
      <img src="assets/img/ornaments/ornament-04.png" class="orn" data-id="04">
      <img src="assets/img/ornaments/ornament-05.png" class="orn" data-id="05">
      <img src="assets/img/ornaments/ornament-06.png" class="orn" data-id="06">
      <img src="assets/img/ornaments/ornament-07.png" class="orn" data-id="07">
      <img src="assets/img/ornaments/ornament-08.png" class="orn" data-id="08">
      <img src="assets/img/ornaments/ornament-09.png" class="orn" data-id="09">
      <img src="assets/img/ornaments/ornament-10.png" class="orn" data-id="10">
      <img src="assets/img/ornaments/ornament-11.png" class="orn" data-id="11">
      <img src="assets/img/ornaments/ornament-12.png" class="orn" data-id="12">
    </div>
  </div>

  <script src="tree.js"></script>
</body>
</html>
