<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decorate The Tree</title>

<!-- 스타일 파일 분리 버전 (style.css 사용) -->
<link rel="stylesheet" href="./assets/css/style.css">

</head>
<body class="panel-closed">

<div class="layout">

  <!-- 🎄 트리 영역 -->
  <div id="tree-area">
    <img id="tree-img" src="./assets/img/tree.png" alt="tree">
  </div>

  <!-- 🎁 오너먼트 패널 -->
  <div id="panel">
    <span class="close-panel">✕</span>
    <h3>오너먼트 선택</h3>

    <div class="ornament-grid" id="ornament-grid">
      <!-- JS에서 오너먼트 자동 생성 -->
    </div>
  </div>

</div>

<!-- 💡 플로팅 버튼 (패널 열기) -->
<div id="floating-btn">
  <img src="./assets/img/bulb.png" alt="menu">
</div>


<!-- 📝 팝업 오버레이 -->
<div id="popup-overlay">

  <div id="memo-popup">

    <!-- 팝업 상단: 삭제 / 닫기 -->
    <div class="popup-top">
      <button class="delete-btn">🗑 삭제</button>
      <span class="close-popup">✕</span>
    </div>

    <!-- 메모 리스트 -->
    <div id="memo-list"></div>

    <!-- 메모 입력 영역 -->
    <div class="memo-input-area">
      <input type="text" class="memo-input" placeholder="메모를 입력하세요">
      <button class="memo-send-btn">보내기</button>
    </div>

  </div>
</div>

<!-- JS -->
<script type="module" src="./assets/js/tree.js"></script>

</body>
</html>
