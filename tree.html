<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>크리스마스트리 꾸미기</title>
<link rel="stylesheet" href="tree.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>

<body>

<div class="tree-container">
  <img id="tree" src="assets/img/tree.png">
</div>

<div class="ornament-panel">
  <h3>오너먼트</h3>
  <div class="ornament-list">
    <img class="ornament" src="assets/img/ornaments/ornament-01.png" data-id="ornament01">
    <img class="ornament" src="assets/img/ornaments/ornament-02.png" data-id="ornament02">
    <img class="ornament" src="assets/img/ornaments/ornament-03.png" data-id="ornament03">
    <img class="ornament" src="assets/img/ornaments/ornament-04.png" data-id="ornament04">
    <img class="ornament" src="assets/img/ornaments/ornament-05.png" data-id="ornament05">
    <img class="ornament" src="assets/img/ornaments/ornament-06.png" data-id="ornament06">
    <img class="ornament" src="assets/img/ornaments/ornament-07.png" data-id="ornament07">
    <img class="ornament" src="assets/img/ornaments/ornament-08.png" data-id="ornament08">
    <img class="ornament" src="assets/img/ornaments/ornament-09.png" data-id="ornament09">
    <img class="ornament" src="assets/img/ornaments/ornament-10.png" data-id="ornament10">
  </div>
</div>

<!-- SVG polygon (경계 영역) -->
<svg width="0" height="0">
  <polygon id="tree-area"
    points="
      960,240
      1010,310
      1070,390
      1130,480
      1170,560
      1200,650
      1180,750
      1140,830
      1070,900
      960,950
      850,900
      780,830
      740,750
      720,650
      750,560
      800,480
      860,390
      910,310
    ">
  </polygon>
</svg>

<!-- 메모 창 -->
<div id="memoModal" class="modal">
  <div class="modal-content">
    <textarea id="memoText" placeholder="메모를 입력하세요"></textarea>
    <button id="saveMemo">저장</button>
    <button id="closeMemo">닫기</button>
  </div>
</div>

<script src="tree.js"></script>
</body>
</html>
